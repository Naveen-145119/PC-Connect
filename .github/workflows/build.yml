name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.403
      - name: Test and build Windows installers
        shell: pwsh
        run: ./build.ps1 -Installer
      - name: Upload installable packages and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pc-connect-windows
          path: |
            outputs/PCConnect-Setup-*
            outputs/PCConnect-Portable-*.zip
            outputs/SHA256SUMS.txt
            outputs/test-results.txt
          if-no-files-found: warn
          retention-days: 14
